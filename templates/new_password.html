<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Set New Password</h1>
        <form method="POST" action="{{ url_for('reset_token', token=token) }}" id="password-form">
            <div class="form-group">
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="New Password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Toggle Password">
                        <span class="material-icons">visibility</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm New Password" required>
                    <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Toggle Password">
                        <span class="material-icons">visibility</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <div id="password-strength-bar" class="password-strength-bar">
                    <div id="password-progress" class="password-progress"></div>
                </div>
            </div>
            <div class="form-group">
                <div id="password-requirements" class="password-requirements">
                    <ul>
                        <li id="length" class="requirement">
                            <input type="checkbox" id="check-length" disabled>
                            <label for="check-length">At least 8 characters</label>
                        </li>
                        <li id="number" class="requirement">
                            <input type="checkbox" id="check-number" disabled>
                            <label for="check-number">Contains a number or special character</label>
                        </li>
                        <li id="case" class="requirement">
                            <input type="checkbox" id="check-case" disabled>
                            <label for="check-case">Contains upper and lower case letters</label>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="form-group">
                <input type="submit" value="Reset Password" id="submit-btn">
            </div>
        </form>
    </div>
    <!-- ...existing footer... -->
    <script src="{{ url_for('static', filename='flash-message.js') }}"></script>
    <script src="{{ url_for('static', filename='password-check.js') }}"></script>
</body>
</html>
